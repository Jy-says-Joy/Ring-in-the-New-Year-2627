name: Daily Seoul leads
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-seoul-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect leads and retain error status
        id: monitor
        run: |
          set +e
          python3 scripts/monitor.py
          result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate before writing
        run: npm run check
      - name: Commit monitor data only
        run: |
          git config user.name 'seoul-guide-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/updates.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Seoul news leads (unverified)"
            git push origin HEAD:main
          fi
      - name: Surface total collection failure
        if: steps.monitor.outputs.result != '0'
        run: |
          echo 'All sources failed. The site retains old leads and shows the failed attempt.'
          exit 1
